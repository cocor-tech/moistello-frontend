name: CI

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test -- --run

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bundle analysis (static)
        run: |
          # generate source maps for analysis (Next may need productionBrowserSourceMaps)
          npx source-map-explorer "./.next/static/**/*.js" --json > bundle-report.json || echo "bundle analysis skipped"

  perf:
    name: Performance (Lighthouse + Bundle Budget)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build for perf
        run: npm run build
      - name: Start Next.js
        run: |
          nohup npm run start -- -p 8080 &
          npx wait-on http://localhost:8080
        env:
          PORT: 8080
      - name: Run Lighthouse CI
        run: npx lhci autorun --config=lighthouserc.json
      - name: Check JS bundle budget
        run: node tools/check-bundle-size.js
        env:
          JS_BUDGET: 1200000

  # E2E tests run on the Playwright config (headless Chromium).
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e